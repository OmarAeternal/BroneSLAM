<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="240" viewBox="0 0 660 240" role="img" aria-label="Asal tembok dobel: bila pose dua node benar, tembok dari keduanya jatuh di garis yang sama. Bila pose node B meleset 30 cm, grid lokal B menggambar tembok yang sama 30 cm bergeser, sehingga peta menampilkan dua tembok."><style>/* SVG */
.bx { fill: #fff; stroke: #1a1a1a; stroke-width: 1.2; }
.bx-in { fill: #f3f3f3; stroke: #9a9a9a; stroke-width: .8; }
.bx-bad { fill: #fff; stroke: #a3271b; stroke-width: 1.2; stroke-dasharray: 5 4; }
.t { fill: #1a1a1a; font: 600 13px "Source Sans 3", "Liberation Sans", Arial, sans-serif; }
.tm { fill: #1a1a1a; font: 500 12.5px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.s { fill: #555555; font: 400 12px "Source Sans 3", "Liberation Sans", Arial, sans-serif; }
.el { fill: #555555; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-loc { fill: #1d6b5f; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-slam { fill: #2f4f8f; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-map { fill: #9a5a12; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-bad { fill: #a3271b; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.e { fill: none; stroke-width: 1.3; }
.e-loc { stroke: #1d6b5f; } .e-slam { stroke: #2f4f8f; } .e-map { stroke: #9a5a12; }
.e-fg { stroke: #1a1a1a; } .e-bad { stroke: #a3271b; stroke-dasharray: 5 4; }
.ah-loc { fill: #1d6b5f; } .ah-slam { fill: #2f4f8f; } .ah-map { fill: #9a5a12; }
.ah-fg { fill: #1a1a1a; } .ah-bad { fill: #a3271b; }
.wall { stroke: #9a5a12; stroke-width: 4; }
.wall-ghost { stroke: #9a5a12; stroke-width: 4; opacity: .5; }
.ray { stroke: #555555; stroke-width: .8; stroke-dasharray: 3 3; }
.bot { fill: #1a1a1a; }
.bot-ghost { fill: none; stroke: #a3271b; stroke-width: 1.3; stroke-dasharray: 3 2; }
</style><rect width="100%" height="100%" fill="#fff"/>
        <text class="t" x="155" y="20" text-anchor="middle">Pose node benar</text>
        <line class="wall" x1="30" y1="80" x2="290" y2="80"/>
        <line class="ray" x1="100" y1="180" x2="80" y2="84"/><line class="ray" x1="100" y1="180" x2="120" y2="84"/>
        <line class="ray" x1="210" y1="180" x2="190" y2="84"/><line class="ray" x1="210" y1="180" x2="230" y2="84"/>
        <circle class="bot" cx="100" cy="190" r="9"/><circle class="bot" cx="210" cy="190" r="9"/>
        <text class="el" x="100" y="218" text-anchor="middle">node A</text>
        <text class="el" x="210" y="218" text-anchor="middle">node B</text>
        <text class="s" x="30" y="104">satu tembok</text>

        <line x1="325" y1="10" x2="325" y2="230" stroke="#9a9a9a" stroke-width="1"/>

        <text class="t" x="505" y="20" text-anchor="middle">Pose node B meleset 30 cm</text>
        <line class="wall" x1="370" y1="80" x2="640" y2="80"/>
        <line class="wall-ghost" x1="470" y1="50" x2="640" y2="50"/>
        <text class="el-map" x="370" y="104">dari node A</text>
        <text class="el-map" x="370" y="54">dari node B →</text>
        <line class="ray" x1="430" y1="180" x2="410" y2="84"/><line class="ray" x1="430" y1="180" x2="450" y2="84"/>
        <line class="ray" x1="560" y1="150" x2="540" y2="54"/><line class="ray" x1="560" y1="150" x2="580" y2="54"/>
        <circle class="bot" cx="430" cy="190" r="9"/>
        <circle class="bot" cx="560" cy="190" r="9" opacity=".35"/>
        <circle class="bot-ghost" cx="560" cy="160" r="9"/>
        <line x1="580" y1="188" x2="580" y2="164" stroke="#a3271b" stroke-width="1.5"/>
        <text class="el-bad" x="588" y="180">30 cm</text>
        <text class="el" x="430" y="218" text-anchor="middle">node A</text>
        <text class="el" x="560" y="218" text-anchor="middle">B asli · B di graf</text>
      </svg>
