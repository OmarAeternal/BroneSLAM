<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="Aliran data: driver D455 mengirim RGB-D ke VO dan RTAB-Map, odometri roda dan gyro ke EKF, scan ke RTAB-Map dan auto_explorer; EKF mengirim TF odom ke base_link ke RTAB-Map; RTAB-Map mengirim peta dan TF map ke odom ke auto_explorer dan RViz; auto_explorer mengirim cmd_vel ke driver."><style>/* SVG */
.bx { fill: #fff; stroke: #1a1a1a; stroke-width: 1.2; }
.bx-in { fill: #f3f3f3; stroke: #9a9a9a; stroke-width: .8; }
.bx-bad { fill: #fff; stroke: #a3271b; stroke-width: 1.2; stroke-dasharray: 5 4; }
.t { fill: #1a1a1a; font: 600 13px "Source Sans 3", "Liberation Sans", Arial, sans-serif; }
.tm { fill: #1a1a1a; font: 500 12.5px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.s { fill: #555555; font: 400 12px "Source Sans 3", "Liberation Sans", Arial, sans-serif; }
.el { fill: #555555; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-loc { fill: #1d6b5f; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-slam { fill: #2f4f8f; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-map { fill: #9a5a12; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.el-bad { fill: #a3271b; font: 400 11px "Source Code Pro", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.e { fill: none; stroke-width: 1.3; }
.e-loc { stroke: #1d6b5f; } .e-slam { stroke: #2f4f8f; } .e-map { stroke: #9a5a12; }
.e-fg { stroke: #1a1a1a; } .e-bad { stroke: #a3271b; stroke-dasharray: 5 4; }
.ah-loc { fill: #1d6b5f; } .ah-slam { fill: #2f4f8f; } .ah-map { fill: #9a5a12; }
.ah-fg { fill: #1a1a1a; } .ah-bad { fill: #a3271b; }
.wall { stroke: #9a5a12; stroke-width: 4; }
.wall-ghost { stroke: #9a5a12; stroke-width: 4; opacity: .5; }
.ray { stroke: #555555; stroke-width: .8; stroke-dasharray: 3 3; }
.bot { fill: #1a1a1a; }
.bot-ghost { fill: none; stroke: #a3271b; stroke-width: 1.3; stroke-dasharray: 3 2; }
</style><rect width="100%" height="100%" fill="#fff"/>
        <defs>
          <marker id="o-loc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-loc" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="o-slam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-slam" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="o-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-map" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="o-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-fg" d="M0 0 L10 5 L0 10 z"/></marker>
        </defs>

        <!-- Driver -->
        <rect class="bx" x="20" y="40" width="190" height="380"/>
        <text class="tm" x="115" y="66" text-anchor="middle">d455_rtabmap_driver</text>
        <text class="s" x="115" y="84" text-anchor="middle">Webots · model D455 · 3 roda</text>
        <text class="el" x="200" y="114" text-anchor="end">RGB-D</text>
        <text class="el" x="200" y="244" text-anchor="end">/wheel/odom</text>
        <text class="el" x="200" y="294" text-anchor="end">/imu/data</text>
        <text class="el" x="200" y="354" text-anchor="end">/scan</text>
        <text class="el" x="115" y="410" text-anchor="middle">← /cmd_vel</text>

        <!-- VO -->
        <rect class="bx" x="300" y="120" width="200" height="60"/>
        <text class="tm" x="402" y="146" text-anchor="middle">rgbd_visual_odometry</text>
        <text class="s" x="402" y="164" text-anchor="middle">fitur LK → RANSAC rigid 2D</text>

        <!-- EKF -->
        <rect class="bx" x="300" y="220" width="200" height="90"/>
        <text class="tm" x="402" y="248" text-anchor="middle">ekf_sensor_fusion</text>
        <text class="s" x="402" y="267" text-anchor="middle">state x, y, θ, vx, vy, ωz</text>
        <text class="s" x="402" y="285" text-anchor="middle">keluar /odom</text>

        <!-- RTAB-Map -->
        <rect class="bx" x="590" y="40" width="210" height="330"/>
        <text class="tm" x="695" y="66" text-anchor="middle">rtabmap</text>
        <text class="s" x="695" y="84" text-anchor="middle">RTAB-Map · deteksi 2 Hz</text>
        <rect class="bx-in" x="606" y="100" width="178" height="42"/>
        <text class="s" x="697" y="125" text-anchor="middle">node: RGB-D + scan + pose</text>
        <rect class="bx-in" x="606" y="155" width="178" height="42"/>
        <text class="s" x="697" y="180" text-anchor="middle">loop closure &amp; proximity</text>
        <rect class="bx-in" x="606" y="210" width="178" height="42"/>
        <text class="s" x="697" y="235" text-anchor="middle">optimasi graf → map→odom</text>
        <rect class="bx-in" x="606" y="265" width="178" height="42"/>
        <text class="s" x="697" y="290" text-anchor="middle">grid lokal → peta 2D /map</text>
        <rect class="bx-in" x="606" y="320" width="178" height="38"/>
        <text class="s" x="697" y="343" text-anchor="middle">awan titik 3D</text>

        <!-- RViz & explorer -->
        <rect class="bx" x="870" y="60" width="150" height="70"/>
        <text class="tm" x="945" y="92" text-anchor="middle">rviz2</text>
        <text class="s" x="945" y="110" text-anchor="middle">tampilan saja</text>
        <rect class="bx" x="870" y="250" width="150" height="90"/>
        <text class="tm" x="945" y="286" text-anchor="middle">auto_explorer</text>
        <text class="s" x="945" y="305" text-anchor="middle">rencana jalur + rem</text>

        <!-- edges -->
        <line class="e e-slam" x1="210" y1="110" x2="586" y2="110" marker-end="url(#o-slam)"/>
        <text class="el-slam" x="430" y="102" text-anchor="middle">RGB + depth selaras + camera_info</text>
        <path class="e e-loc" d="M250 110 V150 H296" marker-end="url(#o-loc)"/>
        <line class="e e-loc" x1="402" y1="180" x2="402" y2="216" marker-end="url(#o-loc)"/>
        <text class="el-loc" x="410" y="203">/vo/odom</text>
        <line class="e e-loc" x1="210" y1="240" x2="296" y2="240" marker-end="url(#o-loc)"/>
        <text class="el-loc" x="253" y="233" text-anchor="middle">vx, vy</text>
        <line class="e e-loc" x1="210" y1="290" x2="296" y2="290" marker-end="url(#o-loc)"/>
        <text class="el-loc" x="253" y="283" text-anchor="middle">gyro ωz</text>
        <line class="e e-loc" x1="500" y1="265" x2="586" y2="265" marker-end="url(#o-loc)"/>
        <text class="el-loc" x="543" y="282" text-anchor="middle">TF</text>
        <text class="el-loc" x="543" y="296" text-anchor="middle">odom→base</text>
        <line class="e e-slam" x1="210" y1="350" x2="586" y2="350" marker-end="url(#o-slam)"/>
        <text class="el-slam" x="400" y="343" text-anchor="middle">/scan (irisan depth)</text>
        <path class="e e-fg" d="M540 350 V400 H900 V344" marker-end="url(#o-fg)"/>
        <text class="el" x="720" y="393" text-anchor="middle">/scan · memori 5 s untuk rem</text>
        <line class="e e-map" x1="800" y1="95" x2="866" y2="95" marker-end="url(#o-map)"/>
        <text class="el-map" x="833" y="87" text-anchor="middle">/map</text>
        <text class="el-map" x="833" y="114" text-anchor="middle">cloud</text>
        <line class="e e-map" x1="800" y1="280" x2="866" y2="280" marker-end="url(#o-map)"/>
        <text class="el-map" x="833" y="272" text-anchor="middle">/map</text>
        <line class="e e-loc" x1="800" y1="320" x2="866" y2="320" marker-end="url(#o-loc)"/>
        <text class="el-loc" x="833" y="337" text-anchor="middle">map→odom</text>
        <path class="e e-fg" d="M990 340 V445 H115 V424" marker-end="url(#o-fg)"/>
        <text class="el" x="550" y="438" text-anchor="middle">/cmd_vel (vx, vy, ωz)</text>
      </svg>
